name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: dummy-key-for-ci
      QDRANT_COLLECTION: ci_test_collection
      ANTHROPIC_API_KEY: dummy-anthropic-key-for-ci
      API_KEY: dummy-api-key-for-ci   # Required so the app's Settings() can initialize in the mypy step.  # pytest overrides this with its own key via tests/conftest.py.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
