<svg viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrow-ing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8743f"/>
    </marker>
    <marker id="arrow-qry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6cc8"/>
    </marker>
    <marker id="arrow-rsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a5fc4"/>
    </marker>
  </defs>

  <style>
    .node { stroke-width: 1.5; }
    .label { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #ffffff; font-size: 11px; text-anchor: middle; }
    .entry { fill: none; stroke: #8a8a8a; }
    .entry-label { fill: #888; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .api { fill: #4a4a52; stroke: #7a7a86; }
    .ing { fill: #b5652f; stroke: #d98a5f; }
    .qry { fill: #3461b0; stroke: #5f8ad9; }
    .rsp { fill: #7b4f96; stroke: #a87fc4; }
    .store { fill: #1d8a68; stroke: #14694f; }
    .edge { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
    .edge-ing { fill: none; stroke: #c8743f; stroke-width: 1.8; }
    .edge-qry { fill: none; stroke: #3f6cc8; stroke-width: 1.8; }
    .edge-rsp { fill: none; stroke: #9a5fc4; stroke-width: 1.8; }
    .elabel { font-size: 11px; fill: #999; }
    .elabel-w { font-size: 11px; }
  </style>

  <!-- ================= EDGES (drawn first, under nodes) ================= -->

  <!-- Entry: PDF upload -> API -->
  <path class="edge" d="M120,72 L120,110 L300,110 L300,138" marker-end="url(#arrow)"/>
  <text class="elabel" x="128" y="103">POST /documents</text>

  <!-- Entry: User -> API -->
  <path class="edge" d="M640,72 L640,110 L460,110 L460,138" marker-end="url(#arrow)"/>
  <text class="elabel" x="555" y="103" text-anchor="end">POST /query</text>

  <!-- Ingestion: API -> Extract -->
  <path class="edge-ing" d="M330,182 L330,210 L150,210 L150,238" marker-end="url(#arrow-ing)"/>
  <text class="elabel-w" fill="#c8743f" x="158" y="203">PDF</text>
  <!-- Extract -> Embed chunks -->
  <path class="edge-ing" d="M150,288 L150,338" marker-end="url(#arrow-ing)"/>
  <!-- Embed chunks -> Qdrant -->
  <path class="edge-ing" d="M150,388 L150,470 L330,470 L330,500" marker-end="url(#arrow-ing)"/>
  <text class="elabel-w" fill="#c8743f" x="158" y="445">batched upsert</text>

  <!-- Query: API -> Embed question -->
  <path class="edge-qry" d="M430,182 L430,210 L560,210 L560,238" marker-end="url(#arrow-qry)"/>
  <text class="elabel-w" fill="#3f6cc8" x="568" y="203">question</text>
  <!-- Embed question -> Vector search -->
  <path class="edge-qry" d="M560,288 L560,338" marker-end="url(#arrow-qry)"/>
  <!-- Vector search -> Qdrant (query vector) -->
  <path class="edge-qry" d="M520,375 L420,375 L420,520 L388,520" marker-end="url(#arrow-qry)"/>
  <text class="elabel-w" fill="#3f6cc8" x="432" y="448">query vector</text>
  <!-- Qdrant -> Vector search (matches) -->
  <path class="edge-qry" d="M388,540 L470,540 L470,392 L560,392 L560,388" marker-end="url(#arrow-qry)"/>
  <text class="elabel-w" fill="#3f6cc8" x="478" y="470">matches</text>

  <!-- Response: Vector search -> Claude (top-k chunks) -->
  <path class="edge-rsp" d="M600,388 L600,630 L560,630" marker-end="url(#arrow-rsp)"/>
  <text class="elabel-w" fill="#9a5fc4" x="608" y="500">top-k chunks</text>
  <!-- Claude -> API (answer) -->
  <path class="edge-rsp" d="M600,633 L720,633 L720,160 L530,160" marker-end="url(#arrow-rsp)"/>
  <text class="elabel-w" fill="#9a5fc4" x="712" y="400" text-anchor="end">answer + [Source N]</text>
  <!-- API -> User (response) -->
  <path class="edge-rsp" d="M460,182 L460,130 L660,130 L660,46" marker-end="url(#arrow-rsp)"/>
  <text class="elabel-w" fill="#9a5fc4" x="590" y="123" text-anchor="end">response</text>

  <!-- ================= NODES ================= -->

  <!-- PDF upload (entry, top-left) -->
  <rect class="entry" x="60" y="22" width="120" height="40" rx="20"/>
  <text class="entry-label" x="120" y="46">PDF upload</text>

  <!-- User (entry, top-right) -->
  <ellipse class="entry" cx="640" cy="44" rx="50" ry="22"/>
  <text class="entry-label" x="640" y="48">User</text>

  <!-- FastAPI (center top) -->
  <rect class="node api" x="240" y="138" width="280" height="44" rx="6"/>
  <text class="label" x="380" y="156">FastAPI</text>
  <text class="sub" x="380" y="172">X-API-Key auth</text>

  <!-- Extract + chunk (ingestion) -->
  <rect class="node ing" x="60" y="238" width="180" height="50" rx="6"/>
  <text class="label" x="150" y="259">Extract + chunk</text>
  <text class="sub" x="150" y="275">pypdf</text>

  <!-- Embed chunks (ingestion) -->
  <rect class="node ing" x="60" y="338" width="180" height="50" rx="6"/>
  <text class="label" x="150" y="359">Embed chunks</text>
  <text class="sub" x="150" y="375">MiniLM, CPU</text>

  <!-- Embed question (query) -->
  <rect class="node qry" x="470" y="238" width="180" height="50" rx="6"/>
  <text class="label" x="560" y="259">Embed question</text>
  <text class="sub" x="560" y="275">MiniLM, CPU</text>

  <!-- Vector search (query) -->
  <rect class="node qry" x="490" y="350" width="140" height="40" rx="6"/>
  <text class="label" x="560" y="374">Vector search</text>

  <!-- Qdrant (store, center) -->
  <path class="node store" d="M300,500 v44 a48,12 0 0,0 96,0 v-44" />
  <ellipse class="node store" cx="348" cy="500" rx="48" ry="12"/>
  <text class="label" x="348" y="534">Qdrant</text>
  <text class="sub" x="348" y="550">vector store</text>

  <!-- Claude Haiku (response) -->
  <rect class="node rsp" x="420" y="608" width="180" height="50" rx="6"/>
  <text class="label" x="510" y="629">Claude Haiku</text>
  <text class="sub" x="510" y="645">grounded generation</text>

</svg>
